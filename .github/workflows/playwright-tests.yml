name: Playwright Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIGURATION: Release

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: api-tests
            name: API Tests
            filter: TestCategory=Api
            install-browsers: false
          - slug: smoke-tests
            name: Smoke Tests
            filter: TestCategory=Smoke
            install-browsers: true
          - slug: regression-tests
            name: Regression Tests
            filter: TestCategory=Regression
            install-browsers: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Install Playwright browsers
        if: ${{ matrix.install-browsers }}
        run: pwsh bin/${{ env.BUILD_CONFIGURATION }}/net9.0/playwright.ps1 install --with-deps chromium

      - name: Run ${{ matrix.name }}
        env:
          # Read by Infrastructure/RunSettings.cs - screenshots/traces for failed tests land here
          TEST_ARTIFACTS_DIR: ${{ github.workspace }}/TestResults/${{ matrix.slug }}/artifacts
          PW_TRACE: retain-on-failure
        run: >
          dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=${{ matrix.slug }}.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults/${{ matrix.slug }}

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ${{ matrix.name }} Results
          path: TestResults/${{ matrix.slug }}/${{ matrix.slug }}.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.slug }}
          path: TestResults/${{ matrix.slug }}/**
          retention-days: 14
          if-no-files-found: ignore
